name: Actualizacion Diaria de Activos

on:
  schedule:
    - cron: '0 22 * * 1-5'
  workflow_dispatch:
    inputs:
      only_montecarlo:
        description: 'Correr SOLO el paso de Monte Carlo (sin tocar precios/senales/Win Rate/alertas push) -- para probar montecarlo_engine.py de forma aislada.'
        required: false
        type: boolean
        default: false

jobs:
  run-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install yfinance pandas numpy scipy supabase requests pywebpush

      - name: Ejecutar script de actualización
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PAGES_BASE_URL: ${{ secrets.PAGES_BASE_URL }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          ONLY_MONTECARLO: ${{ (github.event.inputs.only_montecarlo == 'true') && '1' || '' }}
        run: |
          python actualizar_automatico.py
